  <rect x="2" y="2" width="60" height="57" rx="15" fill="url(#pq-bg)" stroke="url(#pq-gold)" stroke-width="3"/>
  
  <!-- Inner Glow Accent -->
  <rect x="5" y="5" width="54" height="26" rx="12" fill="#ffffff" fill-opacity="0.08"/>
  
