      <stop offset="100%" stop-color="#0f1c3f"/>
    </linearGradient>
    <linearGradient id="pq-gold" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffe270"/>
      <stop offset="100%" stop-color="#ff9900"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Square with 3D Shadow -->
