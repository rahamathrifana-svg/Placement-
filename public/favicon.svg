  </g>
  
  <!-- Sparkle Star in Top-Right -->
  <path d="M49 7L50.6 11.8L55.5 13.5L50.6 15.2L49 20L47.4 15.2L42.5 13.5L47.4 11.8L49 7Z" fill="url(#pq-gold)"/>
